<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Dashboard</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ESP32 Dashboard</h1>
        <p id="boardId">esp32-weather-001</p>
      </div>
      <div class="status-pills">
        <div class="timezone-control">
          <span class="timezone-icon">TZ</span>
          <button id="timezoneOpenButton" class="timezone-open-button" type="button">
            <span id="timezoneCurrent">Bangkok</span>
          </button>
          <select id="timezoneSelect" class="timezone-select sr-only" aria-label="clock timezone">
            <option value="Asia/Bangkok">Bangkok</option>
            <option value="Asia/Tokyo">Tokyo</option>
            <option value="Asia/Singapore">Singapore</option>
            <option value="Europe/London">London</option>
            <option value="America/New_York">New York</option>
            <option value="UTC">UTC</option>
          </select>
        </div>
        <span id="liveClock" class="clock-pill">--:--:--</span>
        <span id="mqttStatus" class="pill pill-off">MQTT</span>
        <span id="stationStatus" class="pill pill-off">Station</span>
      </div>
    </header>

    <section id="globeOverlay" class="globe-overlay hidden" aria-label="timezone globe">
      <canvas id="globeCanvas"></canvas>
      <div class="globe-shade"></div>
      <div class="globe-panel">
        <div class="globe-panel-head">
          <div>
            <span class="label">Timezone Navigator</span>
            <h2>Choose Your World Clock</h2>
          </div>
          <button id="globeCloseButton" class="globe-close-button" type="button">Close</button>
        </div>
        <div id="timezoneOptions" class="timezone-options"></div>
      </div>
    </section>

    <main class="shell">
      <section class="metrics-grid" aria-label="weather readings">
        <article class="metric-panel">
          <span class="label">Temperature</span>
          <strong id="temperature">--.-</strong>
          <span class="unit">C</span>
        </article>
        <article class="metric-panel">
          <span class="label">Humidity</span>
          <strong id="humidity">--</strong>
          <span class="unit">%</span>
        </article>
        <article class="metric-panel">
          <span class="label">AQI</span>
          <strong id="aqi">-</strong>
          <span id="aqiText" class="unit">Unknown</span>
        </article>
        <article class="metric-panel">
          <span class="label">PM2.5</span>
          <strong id="pm25">--.-</strong>
          <span class="unit">ug/m3</span>
        </article>
      </section>

      <section class="content-grid">
        <section class="panel">
          <div class="panel-title">
            <h2>Relay Control</h2>
            <span id="relayUpdated">Waiting</span>
          </div>
          <div id="relayList" class="relay-list"></div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <h2>WiFi</h2>
            <span id="wifiState">NO OK</span>
          </div>
          <button id="wifiManagerButton" class="wifi-manager-button" type="button">WiFi Manager</button>
          <dl class="info-list">
            <div>
              <dt>IP</dt>
              <dd>
                <span id="ipAddress">Hidden</span>
                <button id="revealIpButton" class="inline-secret-button" type="button">View</button>
              </dd>
            </div>
            <div>
              <dt>RSSI</dt>
              <dd id="rssi">-</dd>
            </div>
            <div>
              <dt>Time</dt>
              <dd id="stationTime">--:--:--</dd>
            </div>
            <div>
              <dt>Uptime</dt>
              <dd id="uptime">-</dd>
            </div>
          </dl>
        </section>

        <section class="panel activity-panel">
          <div class="panel-title">
            <h2>Activity</h2>
            <span id="lastMessage">No data</span>
          </div>
          <ol id="events" class="events"></ol>
        </section>
      </section>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/three@0.133.1/build/three.min.js"></script>
    <script src="../app.js"></script>
  </body>
</html>
